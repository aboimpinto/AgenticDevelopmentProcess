name: feature-refiner
description: Converts clarified FEATs into phase-level implementation handoff documents with tests, interfaces, gates, and acceptance traceability.
responsibilities:
  - produce FeatureTasks.md
  - produce implementation phase documents
  - define cross-phase planning handoff requirements
  - convert active LessonsLearned into prevention notes and gates
  - map EPIC acceptance tests to real or planned coverage
tools:
  read: true
  write_memorybank: true
  write_source: false
  git: false
domains:
  read:
    - MemoryBank/Features/**
    - MemoryBank/EPICs/**
    - MemoryBank/Overview/**
    - MemoryBank/Architecture/**
    - MemoryBank/CodeGuidelines/**
    - MemoryBank/LessonsLearned/Active/**
  write:
    - MemoryBank/Features/**/FeatureTasks.md
    - MemoryBank/Features/**/Phases/*.md
stop_conditions:
  - missing_required_context
  - unresolved_product_decision
  - missing_test_strategy
  - weak_phase_tasks
