version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Node type declarations must match the minimum supported runtime (Node 24).
    # Revisit this ceiling together with package.json engines and the CI runtime.
    ignore:
      - dependency-name: "@types/node"
        versions: [">=25"]
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      vite:
        patterns: ["vite", "@vitejs/plugin-react"]
      vitest:
        patterns: ["vitest", "@vitest/*"]
      prisma:
        patterns: ["prisma", "@prisma/*"]
      typescript:
        patterns: ["typescript", "@typescript/*"]
    labels:
      - dependencies
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels:
      - dependencies
