packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  esbuild: true

# Remove these targeted security overrides when their direct parents adopt the
# patched versions. Values address the GitHub advisories found during dependency
# and public-alpha security reviews.
overrides:
  browserslist: "4.28.7"
  dompurify: "3.4.16"
  "esbuild@>=0.27.3 <0.28.1": "0.28.1"
  # Mermaid requires the vulnerable KaTeX 0.16 line (GHSA-238p-pmpm-9mq7).
  "katex@>=0.11.0 <0.18.2": "0.18.2"
  postcss: "8.5.23"
  "shell-quote@>=1.8.4 <1.11.0": "1.11.0"
  "source-map-js@>=1.0.0 <1.2.2": "1.2.2"
  undici: "7.29.1"
