packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  esbuild: true

# Remove these targeted security overrides when their direct parents adopt the
# patched versions. Values address the GitHub advisories found during dependency
# and public-alpha security reviews.
overrides:
  browserslist: "4.28.7"
  dompurify: "3.4.13"
  "esbuild@>=0.27.3 <0.28.1": "0.28.1"
  # Chevrotain 11.1.2 pins 4.17.23: GHSA-r5fr-rjxr-66jc / GHSA-f23m-r3pf-42rh.
  "lodash-es@<=4.17.23": "4.18.1"
  postcss: "8.5.23"
  shell-quote: "1.9.0"
  undici: "7.29.0"
